# Stage 2: Plain BNN VGG7 training on CIFAR-10, warm-started from FP checkpoint.
#
# Loads the best FP32 checkpoint from Stage 1 (models/fp/model_best.pt) via
# fp32_warmstart mode, which transfers weights into the binary quantized model
# and initialises per-channel scales from FP32 weight statistics.
#
# Training uses BinaryHingeLoss + Clippy (Adam + [-1,1] clamp) — the standard
# NetDrift BNN recipe. No fault-aware training (plain supervised BNN, Phase 1).
#
# Best and final checkpoints are copied to models/bnns/ after training.
# Typical BNN accuracy target: ~88-90% top-1.
#
# Run Stage 1 first:
#   python netdrift_run.py --config configs/vgg7_cifar10_fp_train.yaml
# Then:
#   python netdrift_run.py --config configs/vgg7_cifar10_bnn_train.yaml

experiment:
  name: vgg7_cifar10_bnn
  output_dir: runs/
  seed: 707

model:
  name: vgg7_cifar10
  checkpoint: models/fp/vgg7_cifar10/model_best.pt   # produced by Stage 1
  checkpoint_mode: fp32_warmstart       # FP32 weights → binary quantized model
  kernel_size: 3
  skip_first_quant: false
  skip_last_quant: false

data:
  name: cifar10
  batch_size: 256
  test_batch_size: 256
  num_workers: 4
  data_dir: data

quant:
  scheme: binary
  scale_init: max_abs

storage:
  layout: row
  rt_size: 64
  kernel_mapping: row

fault:
  model: rtm_misalignment
  rt_error: 0.0         # no faults during plain BNN training
  mitigations: []
  protection:
    policy: all

training:
  mode: train
  fault_aware: none     # plain BNN; fault-aware training is Phase 2
  epochs: 100
  lr: 1.0               # Clippy (Adam) default for BNN training
  gamma: 0.1
  step_size: 30
  save_dir: models/bnns/vgg7_cifar10/ # model.pt + model_best.pt copied here after training

metrics:
  online: []
  offline: []
  sinks:
    - type: stdout
    - type: jsonl

gpu_num: 0
