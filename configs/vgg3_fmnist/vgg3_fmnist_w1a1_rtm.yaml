# Stage 3: VGG3 / FashionMNIST baseline RTM-fault sweep.
#
# - Pre-trained binary VGG3 checkpoint (W1A1: binary weights, FP activations).
# - RTM misalignment fault model with a sweep over rt_error.
# - All layers unprotected; no mitigation by default.
# - Test mode: run inference once per rt_error.

experiment:
  name: vgg3_fmnist_w1a1_rtm
  output_dir: runs/
  seed: 707

model:
  name: vgg3_fmnist
  checkpoint: models/w1a1/vgg3_fmnist/model_best.pt
  checkpoint_mode: strict
  kernel_size: 3

data:
  name: fmnist
  batch_size: 256
  test_batch_size: 256
  num_workers: 1
  data_dir: data

quant:
  scheme: binary
  scale_init: max_abs

storage:
  layout: row
  rt_size: 64
  kernel_mapping: row           # row | col | clw | acw

fault:
  model: rtm_misalignment
  rt_error: [0.00001, 0.0001]
  global_bitflip_budget: 0.0
  local_bitflip_budget: 0.0
  mitigations: []               # default: no mitigation
  protection:
    policy: custom
    # indiv_layer: 4
    layers: [1, 4]
    # `layers` lists the 1-based layer_ids that stay UNPROTECTED (exposed to faults).
    # Everything not listed is protected. VGG3 has 4 quantized layers
    # (conv1=1, conv2=2, fc1=3, fc2=4). Listing 2..3 leaves the first conv
    # (conv1) and last linear (fc2) protected — a common BNN/QNN recipe.
  weight_encoder: endlen          # "endlen" or null
  weight_encoder_mode: once       # "once" | "per_forward"
  encoded_checkpoint_save: null   # override save path; null → next to model.checkpoint

training:
  mode: test                    # test | train
  fault_aware: none             # none | ste_inject | kd | regularization (Phase 2)
  loops: 2

metrics:
  online: []
  offline: []
  sinks:
    - type: stdout
    - type: jsonl

gpu_num: 0
