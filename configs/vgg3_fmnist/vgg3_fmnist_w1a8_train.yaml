# Stage 2 (variant): W1A8 VGG3 training on FashionMNIST, warm-started from FP checkpoint.
#
# 1-bit weights (BinaryScheme, ±1) + 8-bit symmetric uniform activations on
# [-1, 1] (IntUniformActScheme, 256 levels). Quantized activations live on
# conventional RAM in the downstream RTM simulation.
#
# Warm-starts from models/fp/vgg3_fmnist/model_best.pt (Stage 1 artifact).

experiment:
  name: vgg3_fmnist_w1a8
  output_dir: runs/
  seed: 707

model:
  name: vgg3_fmnist
  checkpoint: models/fp/vgg3_fmnist/model_best.pt
  checkpoint_mode: fp32_warmstart
  kernel_size: 3
  skip_first_quant: false
  skip_last_quant: false

data:
  name: fmnist
  batch_size: 256
  test_batch_size: 256
  num_workers: 4
  data_dir: data

quant:
  scheme: binary                # weights: ±1
  scale_init: max_abs
  activation_scheme: int_uniform
  activation_bits: 8            # 256 levels uniformly spaced on [-1, 1]

storage:
  layout: row
  rt_size: 64
  kernel_mapping: row

fault:
  model: rtm_misalignment
  rt_error: 0.0
  mitigations: []
  protection:
    policy: all

training:
  mode: train
  fault_aware: none
  epochs: 100
  lr: 0.001
  gamma: 0.1
  step_size: 35
  save_dir: models/w1a8/vgg3_fmnist/
  # fault_state_mode is only used when faults are injected DURING training
  # (fault_aware training with reg.inject_faults: true, or ste_inject):
  #   fresh      — re-sample a NEW fault realization every batch (reset per-layer
  #                fault_state). Augments over the fault distribution; weights/BN
  #                generalize across realizations. RECOMMENDED.
  #   accumulate — faults persist across batches (stuck-stays-stuck), matching the
  #                eval-sweep semantics. Faithful to one deployment scenario but
  #                risks overfitting to a single fault realization.
  fault_state_mode: fresh       # fresh | accumulate
  # Capability #1 — pattern-preserving recalibration (runs in mode=test, AFTER
  # endlen, BEFORE the rt_error sweep). Recovers the clean-accuracy gap endlen
  # introduces by re-fitting BN running stats + output Scale. Binary weight
  # signs are NEVER changed (endlen pattern preserved). No faults during recal.
  recalibrate:
    enabled: false              # master switch
    bn_stats: true              # re-estimate BN running mean/var (forward only)
    tune_affine: true           # backprop-tune BN gamma/beta + Scale
    epochs: 2                   # tune_affine epochs; 0 ⇒ bn_stats only
    lr: 0.001
    num_batches: null           # cap forward passes for bn_stats (null ⇒ full epoch)
    on: endlen                  # endlen | always
  # Capability #2 — run-length regularizer (mode=train, fault_aware=regularization).
  # Pushes weights toward long same-sign racetrack runs so endlen becomes
  # unnecessary. lambda=0 ⇒ plain training (no run-length term).
  reg:
    lambda: 0.0                 # regularizer weight (>0 enables it)
    beta: 4.0                   # tanh sharpness (sign surrogate)
    inject_faults: false        # also inject RTM faults in forward (STE residual)

metrics:
  online: []
  offline: []
  sinks:
    - type: stdout
    - type: jsonl

gpu_num: 0
