# Stage 3 (variant): W1A8 VGG3 / FashionMNIST inference under RTM faults.
#
# 1-bit weights on nanowires (misalignment faults). 8-bit symmetric uniform
# activations on conventional RAM (no faults). Pairs with the W1A8 training
# config (configs/vgg3_fmnist/vgg3_fmnist_w1a8_train.yaml) — runs the resulting
# checkpoint through the RTM simulator.

experiment:
  name: vgg3_fmnist_w1a8_rtm
  output_dir: runs/
  seed: 707

model:
  name: vgg3_fmnist
  checkpoint: models/w1a8/vgg3_fmnist/model_best.pt
  checkpoint_mode: strict
  kernel_size: 3
  skip_first_quant: false
  skip_last_quant: false

data:
  name: fmnist
  batch_size: 256
  test_batch_size: 256
  num_workers: 1
  data_dir: data

quant:
  scheme: binary
  scale_init: max_abs
  activation_scheme: int_uniform
  activation_bits: 8            # 256 levels uniformly spaced on [-1, 1]

storage:
  layout: row
  rt_size: 64
  kernel_mapping: row

fault:
  model: rtm_misalignment
  rt_error: [0.00001, 0.0001]
  global_bitflip_budget: 1.0    # fraction of all model weights endlen may flip (1.0=unbounded, 0.0=none)
  local_bitflip_budget: 1.0     # fraction within each local unit; for global-only leave this at 1.0
  local_budget_scope: layer     # layer | racetrack | channel
  budget_selection: greedy      # greedy | value_per_flip | magnitude_aware
  mitigations: []
  protection:
    policy: all
    # indiv_layer: 4
    # layers: [1, 4]
    # `layers` lists the 1-based layer_ids that stay UNPROTECTED (exposed to faults).
    # Everything not listed is protected. VGG3 has 4 quantized layers
    # (conv1=1, conv2=2, fc1=3, fc2=4). Listing 2..3 leaves the first conv
    # (conv1) and last linear (fc2) protected — a common BNN/QNN recipe.
  weight_encoder: endlen          # "endlen" or null
  weight_encoder_mode: once       # "once" | "per_forward"
  encoded_checkpoint_save: null   # override save path; null → next to model.checkpoint

training:
  mode: test
  fault_aware: none
  loops: 2

metrics:
  online: []
  offline: []
  sinks:
    - type: stdout
    - type: jsonl

gpu_num: 0
