# Stage 2: Plain BNN VGG3 training on FashionMNIST, warm-started from FP checkpoint.
#
# Loads the best FP32 checkpoint from Stage 1 (models/fp/vgg3_fmnist/model_best.pt)
# via fp32_warmstart mode, which transfers weights into the binary quantized model
# and initialises per-channel scales from FP32 weight statistics.
#
# Training uses BinaryHingeLoss + Clippy (Adam + [-1,1] clamp) — the standard
# NetDrift BNN recipe. No fault-aware training (plain supervised BNN, Phase 1).
#
# Best and final checkpoints are copied to models/w1a1/vgg3_fmnist/ — this is
# the W1A1 baseline (binary weights, FP activations; the family's existing
# naming follows the legacy BNN convention).
#
# Run Stage 1 first:
#   python netdrift_run.py --config configs/vgg3_fmnist/vgg3_fmnist_fp_train.yaml
# Then:
#   python netdrift_run.py --config configs/vgg3_fmnist/vgg3_fmnist_bnn_train.yaml

experiment:
  name: vgg3_fmnist_bnn
  output_dir: runs/
  seed: 707

model:
  name: vgg3_fmnist
  checkpoint: models/fp/vgg3_fmnist/model_best.pt   # produced by Stage 1
  checkpoint_mode: fp32_warmstart       # FP32 weights → binary quantized model
  kernel_size: 3
  skip_first_quant: false
  skip_last_quant: false

data:
  name: fmnist
  batch_size: 256
  test_batch_size: 256
  num_workers: 4
  data_dir: data

quant:
  scheme: binary
  scale_init: max_abs

storage:
  layout: row
  rt_size: 64
  kernel_mapping: row

fault:
  model: rtm_misalignment
  rt_error: 0.0
  mitigations: []
  protection:
    policy: all

training:
  mode: train
  fault_aware: none
  epochs: 100
  lr: 0.001
  gamma: 0.1
  step_size: 35
  save_dir: models/w1a1/vgg3_fmnist/

metrics:
  online: []
  offline: []
  sinks:
    - type: stdout
    - type: jsonl

gpu_num: 0
