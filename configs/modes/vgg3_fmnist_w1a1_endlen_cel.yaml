# MODE: vanilla endlen (CEL) — endlen at full budget (global=1.0, local=1.0).
# CEL variant: includes the cross-entropy base RTM config, so it loads the
# CEL-trained baseline checkpoint and reports criterion=cross_entropy in W&B.
# Only difference from vgg3_fmnist_w1a1_endlen.yaml is the included base.
#
# Run: python netdrift_run.py --config configs/modes/vgg3_fmnist_w1a1_endlen_cel.yaml
defaults:
  - ../vgg3_fmnist/vgg3_fmnist_w1a1_rtm_cel.yaml

experiment:
  name: mode_vgg3_w1a1_endlen_cel

fault:
  weight_encoder: endlen
  weight_encoder_mode: once
  global_bitflip_budget: 1.0      # unbounded — vanilla endlen
  local_bitflip_budget: 1.0

training:
  mode: test
  fault_aware: none
  loops: 10
  recalibrate:
    enabled: false
