# Stage 3 (variant): W1A2 VGG7 / CIFAR-10 inference under RTM faults.
#
# 1-bit weights on nanowires (misalignment faults). 2-bit symmetric uniform
# activations (4 levels: -1, -1/3, +1/3, +1) on conventional RAM (no faults).
# Most aggressive of the W1Ax family; expect the largest accuracy gap vs.
# clean baseline.

experiment:
  name: vgg7_cifar10_w1a2_rtm
  output_dir: runs/
  seed: 707

model:
  name: vgg7_cifar10
  checkpoint: models/w1a2/vgg7_cifar10/model_best.pt
  checkpoint_mode: strict
  kernel_size: 3
  skip_first_quant: false
  skip_last_quant: false

data:
  name: cifar10
  batch_size: 256
  test_batch_size: 256
  num_workers: 1
  data_dir: data

quant:
  scheme: binary
  scale_init: max_abs
  activation_scheme: int_uniform
  activation_bits: 2            # 4 levels: -1, -1/3, +1/3, +1

storage:
  layout: row
  rt_size: 64
  kernel_mapping: row

fault:
  model: rtm_misalignment
  rt_error: [0.0, 0.00001, 0.0001]
  global_bitflip_budget: 0.0
  local_bitflip_budget: 0.0
  mitigations: []
  protection:
    policy: all
    # `layers` lists the 1-based layer_ids that stay UNPROTECTED (exposed to faults).
    # Everything not listed is protected. VGG7 has 8 quantized layers
    # (conv1..conv6 → id 1..6, fc1 → 7, fc2 → 8). Listing 2..7 leaves the first
    # conv (conv1) and last linear (fc2) protected — a common BNN/QNN recipe.
    layers: [2, 3, 4, 5, 6, 7]

training:
  mode: test
  fault_aware: none
  loops: 2

metrics:
  online: []
  offline: []
  sinks:
    - type: stdout
    - type: jsonl

gpu_num: 0
