# Stage 3 (variant): W1A8 VGG7 / CIFAR-10 inference under RTM faults.
#
# 1-bit weights on nanowires (misalignment faults). 8-bit symmetric uniform
# activations on conventional RAM (no faults). Pairs with the W1A8 training
# config (configs/vgg7_cifar10_w1a8_train.yaml) — runs the resulting
# checkpoint through the RTM simulator.

experiment:
  name: vgg7_cifar10_w1a8_rtm
  output_dir: runs/
  seed: 707

model:
  name: vgg7_cifar10
  checkpoint: models/w1a8/vgg7_cifar10/model_best.pt
  checkpoint_mode: strict
  kernel_size: 3
  skip_first_quant: false
  skip_last_quant: false

data:
  name: cifar10
  batch_size: 256
  test_batch_size: 256
  num_workers: 1
  data_dir: data

quant:
  scheme: binary
  scale_init: max_abs
  activation_scheme: int_uniform
  activation_bits: 8            # 256 levels uniformly spaced on [-1, 1]

storage:
  layout: row
  rt_size: 64
  kernel_mapping: row

fault:
  model: rtm_misalignment
  rt_error: [0.00001, 0.0001]
  global_bitflip_budget: 0.0
  local_bitflip_budget: 0.0
  mitigations: []
  protection:
    policy: all
    # layers: [2, 3, 4, 5, 6, 7]
    
    # `layers` lists the 1-based layer_ids that stay UNPROTECTED (exposed to faults).
    # Everything not listed is protected. VGG7 has 8 quantized layers
    # (conv1..conv6 → id 1..6, fc1 → 7, fc2 → 8). Listing 2..7 leaves the first
    # conv (conv1) and last linear (fc2) protected — a common BNN/QNN recipe.
  weight_encoder: endlen          # "endlen" or null
  weight_encoder_mode: once       # "once" | "per_forward"
  encoded_checkpoint_save: null   # override save path; null → next to model.checkpoint


training:
  mode: test
  fault_aware: none
  loops: 2

metrics:
  online: []
  offline: []
  sinks:
    - type: stdout
    - type: jsonl

gpu_num: 0
