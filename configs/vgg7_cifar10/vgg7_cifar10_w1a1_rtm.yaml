# VGG7 / CIFAR-10 baseline RTM-fault sweep.
#
# Replicates the most common legacy use case:
# - Pre-trained binary VGG7 checkpoint (loaded strict from HuggingFace).
# - RTM misalignment fault model with a sweep over rt_error.
# - All layers unprotected; no mitigation.
# - Test mode: run inference once per rt_error.

experiment:
  name: vgg7_cifar10_rtm_baseline
  output_dir: runs/
  seed: 707

model:
  name: vgg7_cifar10
  checkpoint: models/w1a1/vgg7_cifar10/model_best.pt 
  checkpoint_mode: strict       # strict | fp32_warmstart | scheme_transfer
  kernel_size: 3

data:
  name: cifar10
  batch_size: 256
  test_batch_size: 256
  num_workers: 1
  data_dir: data

quant:
  scheme: binary
  scale_init: max_abs

storage:
  layout: row
  rt_size: 64
  kernel_mapping: row           # row | col | clw | acw

fault:
  model: rtm_misalignment
  rt_error: [0.00001]
  global_bitflip_budget: 1.0    # fraction of all model weights endlen may flip (1.0=unbounded, 0.0=none)
  local_bitflip_budget: 1.0     # fraction within each local unit; for global-only leave this at 1.0
  local_budget_scope: layer     # layer | racetrack | channel
  budget_selection: greedy      # greedy | value_per_flip | magnitude_aware
  mitigations: []               # default: no mitigation
  protection:
    policy: custom
    layers: [2, 3, 4, 5, 6, 7]
    
    # `layers` lists the 1-based layer_ids that stay UNPROTECTED (exposed to faults).
    # Everything not listed is protected. VGG7 has 8 quantized layers
    # (conv1..conv6 → id 1..6, fc1 → 7, fc2 → 8). Listing 2..7 leaves the first
    # conv (conv1) and last linear (fc2) protected — a common BNN/QNN recipe.
  weight_encoder: null          # "endlen" or null
  weight_encoder_mode: once       # "once" | "per_forward"
  encoded_checkpoint_save: null   # override save path; null → next to model.checkpoint
  edge_mode: saturate             # saturate | random — racetrack edge/access-port model.
                                  #   saturate (default): access port fixed at ap_position;
                                  #     reads clamp to the nearest real cell (NO random ±1);
                                  #     a partial racetrack replicates its edge value into the tail.
                                  #   random: legacy — a read shifted off the racetrack returns a
                                  #     random ±1. Use for A/B comparison against the old model.
                                  #   NB: storage.layout=block under saturate is fault-immune
                                  #       (same-sign blocks) — use random for a non-trivial BLOCK curve.
  ap_position: null               # fixed access-port index in [0, rt_size-1] (saturate only);
                                  #   null → rt_size//2 - 1 (first middle position). Leave null for block.


training:
  mode: test                    # test | train
  fault_aware: none             # none | ste_inject | kd | regularization (Phase 2)
  loops: 10
  # fault_state_mode is only used when faults are injected DURING training
  # (fault_aware training with reg.inject_faults: true, or ste_inject):
  #   fresh      — re-sample a NEW fault realization every batch (reset per-layer
  #                fault_state). Augments over the fault distribution; weights/BN
  #                generalize across realizations. RECOMMENDED.
  #   accumulate — faults persist across batches (stuck-stays-stuck), matching the
  #                eval-sweep semantics. Faithful to one deployment scenario but
  #                risks overfitting to a single fault realization.
  fault_state_mode: fresh       # fresh | accumulate
  # Loss criterion (BNN paths only — full-precision always uses CrossEntropyLoss).
  #   criterion / hinge_b            → baseline BNN training AND recalibration
  #                                    sub-step B (cat4b/cat6 tune_affine).
  #   fault_aware_criterion / *_hinge_b → fault-aware training (cat5 regularization
  #                                    + cat8 ste_inject).
  # 'hinge' = modified hinge loss (MHL, Yayla et al.); 'cross_entropy' = CEL.
  criterion: hinge              # hinge | cross_entropy
  hinge_b: 128.0
  fault_aware_criterion: hinge  # hinge | cross_entropy
  fault_aware_hinge_b: 128.0
  # Capability #1 — pattern-preserving recalibration (runs in mode=test, AFTER
  # endlen, BEFORE the rt_error sweep). Recovers the clean-accuracy gap endlen
  # introduces by re-fitting BN running stats + output Scale. Binary weight
  # signs are NEVER changed (endlen pattern preserved). No faults during recal.
  recalibrate:
    enabled: false              # master switch
    bn_stats: true              # re-estimate BN running mean/var (forward only)
    tune_affine: true           # backprop-tune BN gamma/beta + Scale
    epochs: 2                   # tune_affine epochs; 0 ⇒ bn_stats only
    lr: 0.001
    num_batches: null           # cap forward passes for bn_stats (null ⇒ full epoch)
    on: endlen                  # endlen | always
  # Capability #2 — run-length regularizer (mode=train, fault_aware=regularization).
  # Pushes weights toward long same-sign racetrack runs so endlen becomes
  # unnecessary. lambda=0 ⇒ plain training (no run-length term).
  reg:
    lambda: 0.0                 # regularizer weight (>0 enables it)
    beta: 4.0                   # tanh sharpness (sign surrogate)
    inject_faults: false        # also inject RTM faults in forward (STE residual)

metrics:
  online: []
  offline: []
  sinks:
    - type: stdout
    - type: jsonl

gpu_num: 0
